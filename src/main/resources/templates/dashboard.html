<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>MiniSpotify - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h2>Dashboard</h2>

    <!-- Contenido ADMIN -->
    <div sec:authorize="hasRole('ADMIN')" class="card mt-3">
        <div class="card-body">
            <h5 class="card-title">Administración de canciones</h5>
            <p class="card-text">Registra nuevas canciones y consulta las disponibles.</p>
            <a th:href="@{/admin/songs}" class="btn btn-success">Ir a Canciones</a>
        </div>
    </div>

    <!-- Contenido USER -->
    <div sec:authorize="hasRole('USER')" class="row mt-3">
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Mi Playlist</h5>
                    <p class="card-text">Agrega canciones a tu playlist personal.</p>
                    <a th:href="@{/user/playlist}" class="btn btn-success">Ir a Mi Playlist</a>
                </div>
            </div>
        </div>
        <div class="col-md-6">
            <div class="card">
                <div class="card-body">
                    <h5 class="card-title">Historial</h5>
                    <p class="card-text">Revisa las canciones que has agregado.</p>
                    <a th:href="@{/user/history}" class="btn btn-success">Ir a Historial</a>
                </div>
            </div>
        </div>
    </div>
</div>

</body>
</html>
