<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MiniSpotify - Mi Playlist</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h2>Mi Playlist</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Canciones disponibles -->
    <h5 class="mt-4">Canciones disponibles</h5>
    <table class="table table-striped">
        <thead class="table-dark">
        <tr>
            <th>Nombre</th>
            <th>Artista</th>
            <th>Género</th>
            <th>Duración</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="song : ${songs}">
            <td th:text="${song.name}"></td>
            <td th:text="${song.artist}"></td>
            <td th:text="${song.genre}"></td>
            <td th:text="${song.duration}"></td>
            <td>
                <form th:action="@{/user/playlist/add/{id}(id=${song.id})}" method="post">
                    <button type="submit" class="btn btn-success btn-sm"
                            th:disabled="${inPlaylistIds.contains(song.id)}"
                            th:text="${inPlaylistIds.contains(song.id)} ? 'Ya agregada' : 'Agregar'">
                    </button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(songs)}">
            <td colspan="5" class="text-center text-muted">El administrador aún no ha registrado canciones.</td>
        </tr>
        </tbody>
    </table>

    <!-- Mi playlist -->
    <h5 class="mt-5">Mi playlist</h5>
    <table class="table table-striped">
        <thead class="table-dark">
        <tr>
            <th>Fecha de agregado</th>
            <th>Nombre</th>
            <th>Artista</th>
            <th>Estado</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry : ${playlist}">
            <td th:text="${#temporals.format(entry.addedAt, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${entry.song.name}"></td>
            <td th:text="${entry.song.artist}"></td>
            <td><span class="badge bg-success" th:text="${entry.status}"></span></td>
            <td>
                <form th:action="@{/user/playlist/remove/{id}(id=${entry.song.id})}" method="post">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Quitar</button>
                </form>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(playlist)}">
            <td colspan="5" class="text-center text-muted">Tu playlist está vacía.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
