<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MiniSpotify - Canciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h2>Gestión de canciones</h2>

    <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <!-- Formulario de registro -->
    <div class="card mb-4">
        <div class="card-body">
            <h5 class="card-title">Registrar nueva canción</h5>
            <form th:action="@{/admin/songs/new}" method="post" class="row g-3">
                <div class="col-md-3">
                    <input type="text" name="name" class="form-control" placeholder="Nombre de la canción" required>
                </div>
                <div class="col-md-3">
                    <input type="text" name="artist" class="form-control" placeholder="Artista" required>
                </div>
                <div class="col-md-2">
                    <input type="text" name="genre" class="form-control" placeholder="Género" required>
                </div>
                <div class="col-md-2">
                    <input type="text" name="duration" class="form-control" placeholder="Duración (mm:ss)"
                           pattern="\d{1,2}:[0-5]\d" title="Formato mm:ss, ej. 3:45" required>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-success w-100">Registrar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Lista de canciones -->
    <h5>Canciones registradas</h5>
    <table class="table table-striped">
        <thead class="table-dark">
        <tr>
            <th>#</th>
            <th>Nombre</th>
            <th>Artista</th>
            <th>Género</th>
            <th>Duración</th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="song : ${songs}">
            <td th:text="${song.id}"></td>
            <td th:text="${song.name}"></td>
            <td th:text="${song.artist}"></td>
            <td th:text="${song.genre}"></td>
            <td th:text="${song.duration}"></td>
        </tr>
        <tr th:if="${#lists.isEmpty(songs)}">
            <td colspan="5" class="text-center text-muted">Aún no hay canciones registradas.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
