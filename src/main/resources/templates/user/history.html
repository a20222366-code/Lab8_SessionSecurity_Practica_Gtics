<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MiniSpotify - Historial</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4">
    <h2>Historial de canciones agregadas</h2>

    <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

    <table class="table table-striped mt-3">
        <thead class="table-dark">
        <tr>
            <th>Fecha de agregado</th>
            <th>Nombre</th>
            <th>Artista</th>
            <th>Estado</th>
            <th></th>
        </tr>
        </thead>
        <tbody>
        <tr th:each="entry, stat : ${history}">
            <td th:text="${#temporals.format(entry.addedAt, 'dd/MM/yyyy HH:mm')}"></td>
            <td th:text="${entry.song.name}"></td>
            <td th:text="${entry.song.artist}"></td>
            <td>
                <span class="badge"
                      th:classappend="${entry.status == 'Agregado'} ? 'bg-success' : 'bg-secondary'"
                      th:text="${entry.status}"></span>
            </td>
            <td>
                <a th:href="@{/user/history/{i}(i=${stat.index})}"
                   class="btn btn-outline-primary btn-sm">Ver Detalle</a>
            </td>
        </tr>
        <tr th:if="${#lists.isEmpty(history)}">
            <td colspan="5" class="text-center text-muted">Aún no has agregado canciones.</td>
        </tr>
        </tbody>
    </table>
</div>

</body>
</html>
