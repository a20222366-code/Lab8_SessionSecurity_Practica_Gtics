<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>MiniSpotify - Detalle</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="container mt-4" style="max-width: 600px;">
    <h2>Detalle de la canción</h2>

    <div class="card mt-3">
        <div class="card-body">
            <h4 class="card-title" th:text="${entry.song.name}"></h4>
            <hr>
            <dl class="row mb-0">
                <dt class="col-sm-5">Artista</dt>
                <dd class="col-sm-7" th:text="${entry.song.artist}"></dd>

                <dt class="col-sm-5">Género</dt>
                <dd class="col-sm-7" th:text="${entry.song.genre}"></dd>

                <dt class="col-sm-5">Duración</dt>
                <dd class="col-sm-7" th:text="${entry.song.duration}"></dd>

                <dt class="col-sm-5">Fecha de agregado</dt>
                <dd class="col-sm-7"
                    th:text="${#temporals.format(entry.addedAt, 'dd/MM/yyyy HH:mm')}"></dd>

                <dt class="col-sm-5">Estado</dt>
                <dd class="col-sm-7">
                    <span class="badge"
                          th:classappend="${entry.status == 'Agregado'} ? 'bg-success' : 'bg-secondary'"
                          th:text="${entry.status}"></span>
                </dd>
            </dl>
        </div>
    </div>

    <a th:href="@{/user/history}" class="btn btn-secondary mt-3">← Volver al historial</a>
</div>

</body>
</html>
