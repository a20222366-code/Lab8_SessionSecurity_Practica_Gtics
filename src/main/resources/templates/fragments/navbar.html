<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="navbar" class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/dashboard}">🎵 MiniSpotify</a>

        <ul class="navbar-nav me-auto">
            <!-- Opciones ADMIN -->
            <li class="nav-item" sec:authorize="hasRole('ADMIN')">
                <a class="nav-link" th:href="@{/admin/songs}">Canciones</a>
            </li>

            <!-- Opciones USER -->
            <li class="nav-item" sec:authorize="hasRole('USER')">
                <a class="nav-link" th:href="@{/user/playlist}">Mi Playlist</a>
            </li>
            <li class="nav-item" sec:authorize="hasRole('USER')">
                <a class="nav-link" th:href="@{/user/history}">Historial</a>
            </li>
        </ul>

        <!-- Nombre + rol del usuario autenticado -->
        <span class="navbar-text text-white me-3">
            👤 <span sec:authentication="name"></span>
            <span class="badge bg-warning text-dark" sec:authorize="hasRole('ADMIN')">ADMIN</span>
            <span class="badge bg-info text-dark" sec:authorize="hasRole('USER')">USER</span>
        </span>

        <!-- Cerrar sesión (ambos roles) -->
        <form th:action="@{/logout}" method="post" class="d-flex">
            <button type="submit" class="btn btn-outline-light btn-sm">Cerrar sesión</button>
        </form>
    </div>
</nav>

</body>
</html>
